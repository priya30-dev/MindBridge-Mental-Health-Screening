services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mindbridge
      POSTGRES_PASSWORD: mindbridge
      POSTGRES_DB: mindbridge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindbridge"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://mindbridge:mindbridge@db:5432/mindbridge
      ALLOWED_ORIGINS: http://localhost:8501
    volumes:
      - ./models:/app/models:ro   # trained model weights
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_BASE: http://api:8000/api/v1
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  pgdata:
